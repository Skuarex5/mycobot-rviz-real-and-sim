# MoveIt 2 controller configuration for the myCobot 280 M5 Gazebo simulation.
# Connects to the existing mycobot280m5_group_controller spawned by mycobot_280_gazebo.

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - mycobot280m5_group_controller

  mycobot280m5_group_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint2_to_joint1
      - joint3_to_joint2
      - joint4_to_joint3
      - joint5_to_joint4
      - joint6_to_joint5
      - joint6output_to_joint6
