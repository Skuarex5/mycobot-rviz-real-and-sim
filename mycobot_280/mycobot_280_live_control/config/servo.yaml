moveit_servo:
  use_gazebo: true
  command_in_type: speed_units
  scale: {linear: 0.03, rotational: 0.2, joint: 0.25}
  publish_period: 0.02
  low_latency_mode: false
  command_out_type: trajectory_msgs/JointTrajectory
  publish_joint_positions: true
  publish_joint_velocities: false
  publish_joint_accelerations: false
  smoothing_filter_plugin_name: online_signal_smoothing::ButterworthFilterPlugin
  is_primary_planning_scene_monitor: false
  move_group_name: arm_group
  planning_frame: g_base
  ee_frame_name: joint6_flange
  robot_link_command_frame: joint6_flange
  incoming_command_timeout: 0.1
  num_outgoing_halt_msgs_to_publish: 0
  # Raw Jacobian mixes metres and radians: measured condition ~72 at bent safe pose,
  # >1e12 at the straight startup pose. Panda defaults (17/30) halt this smaller arm.
  lower_singularity_threshold: 100.0
  hard_stop_singularity_threshold: 200.0
  leaving_singularity_threshold_multiplier: 2.0
  joint_limit_margin: 0.1
  cartesian_command_in_topic: /mycobot_live/servo_twist
  joint_command_in_topic: /mycobot_live/servo_joint
  joint_topic: /joint_states
  status_topic: /mycobot_live/servo_status
  command_out_topic: /mycobot_live/servo_output
  check_collisions: true
  collision_check_rate: 20.0
  # Normal linkage clearance is ~1.96 mm; a 10 mm margin continuously brakes the arm.
  self_collision_proximity_threshold: 0.001
  scene_collision_proximity_threshold: 0.02
