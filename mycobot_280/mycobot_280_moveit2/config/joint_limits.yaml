# Joint limits for MoveIt 2 planning and time parameterization.
# Position bounds are loaded directly from mycobot_280_m5_gazebo.urdf.xacro
# to avoid MoveIt 2 parameter type conflicts on min_position / max_position.
# Velocity and acceleration bounds are set conservatively (1.0 <= 2.0 rad/s URDF limit)
# with conservative default scaling factors (0.1) for safe initial testing.

default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

joint_limits:
  joint2_to_joint1:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint3_to_joint2:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint4_to_joint3:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint5_to_joint4:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint6_to_joint5:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint6output_to_joint6:
    has_velocity_limits: true
    max_velocity: 1.0
    has_acceleration_limits: true
    max_acceleration: 1.0